name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: QuantLab
    env:
      RUN_IFIND_INTEGRATION: '0'
      MARKET_DATA_PROVIDER: akshare
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -c constraints-tested.txt
      - run: python -m pytest -q
